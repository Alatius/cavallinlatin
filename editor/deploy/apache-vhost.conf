# Paste this block into the existing alatius.com <VirtualHost>.
# Requires: a2enmod proxy proxy_http expires headers

# Security headers applied to everything served under /cavallinlatin/.
# CSP keeps script/style/img loads same-origin so a stored XSS via the editor
# can't fetch attacker-controlled JS, and frame-ancestors blocks clickjacking.
<LocationMatch "^/cavallinlatin">
    # Belt-and-braces with the app's own byte-counting limit: stops an
    # oversized body at the edge, before it reaches the single uvicorn worker.
    LimitRequestBody 1048576
    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
</LocationMatch>

# Column images served straight from disk (fastest path).
Alias /cavallinlatin/columns /var/www/cavallinlatin/editor/data/columns
<Directory /var/www/cavallinlatin/editor/data/columns>
    Require all granted
    Options -Indexes
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
</Directory>

# React SPA build output.
Alias /cavallinlatin /var/www/cavallinlatin/editor/frontend/dist
<Directory /var/www/cavallinlatin/editor/frontend/dist>
    Require all granted
    Options -Indexes
    # Client-side routing: any path not found on disk returns index.html
    # and React Router takes over.
    FallbackResource /cavallinlatin/index.html
</Directory>

# API: proxied to the FastAPI service on localhost. The systemd unit runs
# uvicorn with --proxy-headers so the FastAPI handler sees the real client
# IP via X-Forwarded-For (mod_proxy_http adds it automatically).
ProxyPreserveHost On
ProxyPass        /cavallinlatin/api/ http://127.0.0.1:8001/api/
ProxyPassReverse /cavallinlatin/api/ http://127.0.0.1:8001/api/
