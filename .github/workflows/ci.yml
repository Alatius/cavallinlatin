name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editor/pyproject.toml
      # Node is needed by the fold() contract test, which extracts the TS
      # body and runs it through `node -e` to compare with the Python impl.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend with dev extras
        run: pip install -e '.[dev]'
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The xmlOps case spec. Runs under `node --experimental-strip-types`, so a
      # transitive extensionless import in src/ breaks it — which is how it went
      # unnoticed as dead for several commits. Running it in CI closes that.
      - name: Run xmlOps case spec
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to alatius.com
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 alatius.com >> ~/.ssh/known_hosts
      - name: Trigger deploy
        # The deploy user's authorized_keys forces deploy.sh; the remote
        # command argument is ignored, but we pass `deploy` for clarity in
        # the audit log.
        run: ssh -i ~/.ssh/id_ed25519 deploy@alatius.com deploy
